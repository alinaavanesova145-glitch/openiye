[project]
name = "iye-backend"
version = "0.1.0"
description = "IYE DeepTech Startup Backend API"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.28.0",
    "pydantic>=2.6.0",
    "python-dotenv>=1.0.0",
    "numpy>=1.26.0",
    "scipy>=1.12.0",
    "umap-learn>=0.5.5",
    "hdbscan>=0.8.33",
    "requests>=2.31.0",
    "httpx>=0.27.0",
]

[project.optional-dependencies]
dev = ["ruff>=0.4.0", "websockets>=12.0", "pytest>=8.0.0"]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.pytest.ini_options]
markers = [
    "e2e: hermetic end-to-end tests that launch a real uvicorn subprocess (slower; run explicitly excluded via -m 'not e2e' if needed)",
]

[tool.ruff]
line-length = 110
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = [
    "E501", # line length — the codebase's aligned-assignment style in main.py
            # deliberately runs some lines long; not worth reformatting for this pass
]
