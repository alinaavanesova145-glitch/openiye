[project]
name = "iye-backend"
version = "0.1.0"
description = "IYE DeepTech Startup Backend API"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.28.0",
    "pydantic>=2.6.0",
    "python-dotenv>=1.0.0",
    "numpy>=1.26.0",
    "scipy>=1.12.0",
    "umap-learn>=0.5.5",
    "hdbscan>=0.8.33",
    "requests>=2.31.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]
