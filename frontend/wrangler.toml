# Cloudflare Pages configuration.
#
# Live since 2026-08-25 — real Cloudflare account, project `openiye`,
# deployed at https://openiye.pages.dev (custom domain not yet purchased,
# see docs/free_tier_launch_steps.md). The GitHub repo is connected for
# git-triggered builds; the dashboard's own Root directory / Build command
# / Build output directory fields (set once, in the UI, not via this file)
# are what Cloudflare actually builds from:
#   Root directory:          frontend
#   Build command:           npm run build
#   Build output directory:  dist   (i.e. frontend/dist, relative to the
#                                     root directory above)
# Cloudflare Pages needs the "Root directory" field because this is a
# monorepo (backend/, frontend/, sdk/, docs/) — the buildable Vite project
# lives in frontend/, not the repo root.
#
# `wrangler pages dev` (local Pages emulation) does read this file, and was
# used during the 2026-08-26 sprint's redirect-chain investigation — see
# docs/idealization_report.md for what was and wasn't controllable from
# here (`[assets] html_handling` is not honored for this project type).

name = "openiye"  # matches the real, already-created Cloudflare project
pages_build_output_dir = "./dist"
compatibility_date = "2026-08-01"
